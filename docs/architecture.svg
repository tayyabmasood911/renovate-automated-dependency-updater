<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="72" cy="56" r="14" fill="#0284c7" opacity="0.12"/>
  <path d="M 66 56 L 70 60 L 78 52" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="62" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="-0.3">Enterprise Renovate Bot Automated Dependency Maintenance Architecture</text>
  
  <rect x="880" y="42" width="125" height="28" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="898" y="60" fill="#15803d" font-size="11" font-weight="700">AUTOMERGE</text>
  <rect x="1015" y="42" width="125" height="28" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1030" y="60" fill="#1d4ed8" font-size="11" font-weight="700">SEMANTIC CI</text>

  <!-- COLUMN 1: Upstream Registries & Manifests -->
  <rect x="40" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 40 122 A 10 10 0 0 1 50 112 L 280 112 A 10 10 0 0 1 290 122 L 290 156 L 40 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="141" fill="#0f172a" font-size="13" font-weight="700">1. UPSTREAM SOURCES</text>

  <rect x="56" y="174" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="200" fill="#0f172a" font-size="13" font-weight="700">Package Registries</text>
  <text x="70" y="222" fill="#64748b" font-size="11">npm, PyPI, Go Modules, Maven</text>
  <rect x="70" y="236" width="120" height="20" rx="4" fill="#e0f2fe"/>
  <text x="78" y="250" fill="#0369a1" font-size="10" font-weight="600">Semver &amp; Changelogs</text>

  <rect x="56" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="312" fill="#0f172a" font-size="13" font-weight="700">OCI &amp; Docker Registries</text>
  <text x="70" y="334" fill="#64748b" font-size="11">Docker Hub, GHCR, Quay</text>
  <rect x="70" y="348" width="130" height="20" rx="4" fill="#f0fdf4"/>
  <text x="78" y="362" fill="#15803d" font-size="10" font-weight="600">Base Image Digests</text>

  <rect x="56" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="424" fill="#0f172a" font-size="13" font-weight="700">GitHub Actions Marketplace</text>
  <text x="70" y="446" fill="#64748b" font-size="11">actions/*, third-party steps</text>
  <rect x="70" y="460" width="130" height="20" rx="4" fill="#fef3c7"/>
  <text x="78" y="474" fill="#b45309" font-size="10" font-weight="600">Pin to Immutable SHA</text>

  <rect x="56" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="536" fill="#0f172a" font-size="13" font-weight="700">Security CVE Advisories</text>
  <text x="70" y="558" fill="#64748b" font-size="11">GHSA, OSV.dev, NVD feeds</text>
  <text x="70" y="578" fill="#dc2626" font-size="10" font-weight="600">Vulnerability Fast-Track</text>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="290" y1="372" x2="330" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: Renovate Engine & Regex Managers -->
  <rect x="330" y="112" width="260" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 330 122 A 10 10 0 0 1 340 112 L 580 112 A 10 10 0 0 1 590 122 L 590 156 L 330 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="348" y="141" fill="#0f172a" font-size="13" font-weight="700">2. RENOVATE ENGINE</text>

  <rect x="348" y="174" width="224" height="135" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="362" y="200" fill="#0369a1" font-size="14" font-weight="700">Configuration Engine</text>
  <text x="362" y="222" fill="#0f172a" font-size="11">renovate.json + Presets</text>
  <text x="362" y="240" fill="#64748b" font-size="11">• Weekly Schedule (Monday 5am)</text>
  <text x="362" y="258" fill="#64748b" font-size="11">• Stability Days: 3 days minimum</text>
  <text x="362" y="276" fill="#64748b" font-size="11">• Rebase when behind base</text>
  <rect x="362" y="284" width="135" height="16" rx="3" fill="#0284c7"/>
  <text x="368" y="295" fill="#ffffff" font-size="9" font-weight="700">SCHEDULE &amp; THROTTLE</text>

  <rect x="348" y="325" width="224" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="351" fill="#0f172a" font-size="13" font-weight="700">Custom Regex Managers</text>
  <text x="362" y="373" fill="#64748b" font-size="11">In-line Version Parsers</text>
  <text x="362" y="393" fill="#475569" font-size="11">• ARG TOOL_VERSION in Dockerfiles</text>
  <text x="362" y="411" fill="#475569" font-size="11">• TOOL_VERSION in Makefiles</text>
  <rect x="362" y="426" width="140" height="20" rx="4" fill="#dcfce7"/>
  <text x="370" y="440" fill="#15803d" font-size="10" font-weight="600">Zero Unmanaged Tooling</text>

  <rect x="348" y="476" width="224" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="502" fill="#0f172a" font-size="13" font-weight="700">Semantic Commit Formatter</text>
  <text x="362" y="524" fill="#64748b" font-size="11">Conventional Commits Spec</text>
  <text x="362" y="544" fill="#475569" font-size="11">• chore(deps): patch / pin</text>
  <text x="362" y="564" fill="#475569" font-size="11">• fix(security): CVE remediations</text>
  <text x="362" y="586" fill="#0284c7" font-size="10" font-weight="600">Clean Git Changelogs</text>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="590" y1="372" x2="630" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: Smart Grouping & Package Rules -->
  <rect x="630" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 630 122 A 10 10 0 0 1 640 112 L 870 112 A 10 10 0 0 1 880 122 L 880 156 L 630 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="141" fill="#0f172a" font-size="13" font-weight="700">3. SMART PACKAGE RULES</text>

  <rect x="646" y="174" width="218" height="96" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="660" y="200" fill="#991b1b" font-size="13" font-weight="700">Vulnerability Fast-Track</text>
  <text x="660" y="220" fill="#b91c1c" font-size="10" font-weight="600">• Schedule: At any time</text>
  <text x="660" y="238" fill="#b91c1c" font-size="10" font-weight="600">• Uncapped concurrency</text>
  <text x="660" y="256" fill="#15803d" font-size="10" font-weight="600">• Automerge on passing CI</text>

  <rect x="646" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="312" fill="#0f172a" font-size="13" font-weight="700">Monorepo Coordinated Batches</text>
  <text x="660" y="332" fill="#475569" font-size="10">• React &amp; React-DOM suite</text>
  <text x="660" y="350" fill="#475569" font-size="10">• AWS SDK v3 Client packages</text>
  <text x="660" y="368" fill="#0284c7" font-size="10" font-weight="600">• OpenTelemetry Instrumentations</text>

  <rect x="646" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="424" fill="#0f172a" font-size="13" font-weight="700">Patch &amp; Digest Automerge</text>
  <text x="660" y="444" fill="#15803d" font-size="10" font-weight="600">• Zero-friction dependency bumps</text>
  <text x="660" y="462" fill="#15803d" font-size="10" font-weight="600">• Requires 100% Passing CI</text>
  <text x="660" y="480" fill="#475569" font-size="10">• Branch-level merge</text>

  <rect x="646" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="536" fill="#0f172a" font-size="13" font-weight="700">Major Breaking Changes</text>
  <text x="660" y="556" fill="#dc2626" font-size="10" font-weight="600">• Dashboard Approval Required</text>
  <text x="660" y="574" fill="#ea580c" font-size="10" font-weight="600">• Automerge strictly disabled</text>
  <text x="660" y="592" fill="#475569" font-size="10">• feat(deps)!: breaking commit</text>

  <!-- Flow Arrow 3 to 4 -->
  <line x1="880" y1="372" x2="920" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 4: Automerge Controls & PR Management -->
  <rect x="920" y="112" width="240" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 920 122 A 10 10 0 0 1 930 112 L 1150 112 A 10 10 0 0 1 1160 122 L 1160 156 L 920 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="936" y="141" fill="#0f172a" font-size="13" font-weight="700">4. AUTOMERGE &amp; AUDIT</text>

  <rect x="936" y="174" width="208" height="110" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="950" y="200" fill="#14532d" font-size="13" font-weight="700">Platform Automerge</text>
  <text x="950" y="222" fill="#16a34a" font-size="11">Direct branch / PR fast-forward</text>
  <text x="950" y="242" fill="#475569" font-size="11">Enforces branch protection</text>
  <text x="950" y="258" fill="#475569" font-size="11">Zero manual developer friction</text>
  <text x="950" y="272" fill="#15803d" font-size="10" font-weight="600">Green Build Required</text>

  <rect x="936" y="300" width="208" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="326" fill="#0f172a" font-size="13" font-weight="700">Dependency Dashboard</text>
  <text x="950" y="348" fill="#64748b" font-size="11">Interactive GitHub Issue</text>
  <text x="950" y="368" fill="#0284c7" font-size="11" font-weight="600">One-Click PR Generation</text>
  <text x="950" y="384" fill="#475569" font-size="10">Upcoming release overview</text>

  <rect x="936" y="416" width="208" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="442" fill="#0f172a" font-size="13" font-weight="700">Rate Limit Defense</text>
  <text x="950" y="464" fill="#64748b" font-size="11">Max 10 concurrent PRs</text>
  <text x="950" y="484" fill="#475569" font-size="11">Max 2 PRs per hour</text>
  <text x="950" y="498" fill="#0284c7" font-size="10" font-weight="600">Prevents CI Queue Floods</text>

  <rect x="936" y="528" width="208" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="554" fill="#0f172a" font-size="13" font-weight="700">Zero Technical Debt</text>
  <text x="950" y="576" fill="#15803d" font-size="11" font-weight="600">Up-to-Date Baseline</text>
  <text x="950" y="592" fill="#64748b" font-size="10">Zero-day exposure minimizer</text>
</svg>
